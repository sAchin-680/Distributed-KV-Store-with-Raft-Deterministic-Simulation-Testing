syntax = "proto3";

package raft.v1;

option go_package = "github.com/sAchin-680/raftkv/proto/raftpb;raftpb";

// This file is the wire format only. The consensus core has its own Go types and
// converts at the transport boundary, so that the core never depends on protobuf
// and the simulator never has to serialize anything.

// ---------------------------------------------------------------------------
// Log
// ---------------------------------------------------------------------------

enum EntryType {
  ENTRY_TYPE_UNSPECIFIED = 0;

  // A client command, handed to the state machine on commit.
  ENTRY_TYPE_NORMAL = 1;

  // An empty entry a leader appends to its own log immediately on election.
  // Not decoration: the commit rule forbids committing entries from earlier
  // terms directly, so without an entry of its own term a fresh leader can
  // never advance commitIndex over the backlog it inherited, and read-index
  // reads could never be served.
  ENTRY_TYPE_NOOP = 2;

  // A membership change. Carries a marshalled ConfChange in `command`.
  ENTRY_TYPE_CONF_CHANGE = 3;
}

// One command in the replicated log. Index and Term together uniquely identify
// an entry across the whole cluster, for all time.
message LogEntry {
  uint64    term    = 1;
  uint64    index   = 2;
  EntryType type    = 3;
  bytes     command = 4;
}

// ---------------------------------------------------------------------------
// Membership
// ---------------------------------------------------------------------------

// The set of nodes that make up the cluster. During a joint-consensus
// membership change, `old_voters` is non-empty and a decision requires a
// majority of BOTH sets — that overlap is what makes it impossible for two
// disjoint majorities to elect two leaders at the same moment.
message Configuration {
  repeated uint64 voters     = 1;  // C_new
  repeated uint64 old_voters = 2;  // C_old, only during a joint configuration
  repeated uint64 learners   = 3;  // replicated to, but never counted in a majority
}

message ConfChange {
  enum Kind {
    KIND_UNSPECIFIED = 0;

    // Move from C_old to the joint configuration C_old,new.
    KIND_ENTER_JOINT = 1;

    // Leave the joint configuration for C_new alone.
    KIND_LEAVE_JOINT = 2;
  }

  Kind          kind   = 1;
  Configuration config = 2;
}

// ---------------------------------------------------------------------------
// Snapshots
// ---------------------------------------------------------------------------

message Snapshot {
  uint64 last_included_index = 1;
  uint64 last_included_term  = 2;

  // The configuration in force as of last_included_index. A node that restores
  // from a snapshot has discarded the log entries that established the current
  // membership, so the snapshot has to carry it — otherwise the node comes back
  // not knowing who its peers are.
  Configuration config = 3;

  // The serialized state machine (the KV map).
  bytes data = 4;
}

// ---------------------------------------------------------------------------
// Peer RPCs
// ---------------------------------------------------------------------------

message RequestVoteRequest {
  uint64 term           = 1;
  uint64 candidate_id   = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term  = 4;

  // Pre-vote (Raft thesis §9.6): a straw poll at term+1 that does NOT bump the
  // candidate's own term and does not cause the receiver to bump its term.
  // Without it, a node that was partitioned away returns with an inflated term
  // and forces a healthy leader to step down for no reason.
  bool pre_vote = 5;
}

message RequestVoteResponse {
  uint64 term         = 1;
  bool   vote_granted = 2;
  bool   pre_vote     = 3;  // echoed, so a late reply can't be misread as a real vote
}

// Also serves as the heartbeat, with `entries` empty.
message AppendEntriesRequest {
  uint64            term           = 1;
  uint64            leader_id      = 2;
  uint64            prev_log_index = 3;
  uint64            prev_log_term  = 4;
  repeated LogEntry entries        = 5;
  uint64            leader_commit  = 6;

  // Non-zero when this heartbeat is confirming leadership for a read-index
  // read. Echoed back untouched so the leader can match the quorum of replies
  // to the specific read that triggered them.
  uint64 read_id = 7;
}

message AppendEntriesResponse {
  uint64 term    = 1;
  bool   success = 2;

  // The highest index the follower's log now matches the leader on. Sent
  // explicitly rather than inferred by the leader from what it sent, because a
  // delayed or duplicated response must not be able to move matchIndex
  // backwards or forwards incorrectly.
  uint64 match_index = 3;

  // Not in the paper's Figure 2 — the optimization from §5.3 that lets a leader
  // skip a whole term's worth of entries per round trip instead of backing up
  // one index at a time.
  uint64 conflict_index = 4;
  uint64 conflict_term  = 5;

  uint64 read_id = 6;
}

// Sent instead of AppendEntries when the follower is so far behind that the
// entries it needs have already been compacted out of the leader's log.
//
// Single-shot: the whole snapshot travels in one message. Chunking (offset/done
// fields and a resumable transfer) is the obvious next step once snapshots get
// large enough for that to matter.
message InstallSnapshotRequest {
  uint64   term      = 1;
  uint64   leader_id = 2;
  Snapshot snapshot  = 3;
}

message InstallSnapshotResponse {
  uint64 term    = 1;
  bool   success = 2;

  // Where the follower's log now starts, so the leader can reset nextIndex.
  uint64 match_index = 3;
}

service Raft {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotResponse);
}
