syntax = "proto3";

package raft.v1;

option go_package = "github.com/sAchin-680/Go_RAFT_GRPC/proto/raftpb;raftpb";

// One command in the replicated log. Index and Term together uniquely
// identify an entry across the whole cluster, for all time.
message LogEntry {
  uint64 term    = 1;
  uint64 index   = 2;
  bytes  command = 3;
}

message RequestVoteRequest {
  uint64 term           = 1;
  uint64 candidate_id   = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term  = 4;
}

message RequestVoteResponse {
  uint64 term         = 1;
  bool   vote_granted = 2;
}

message AppendEntriesRequest {
  uint64   term           = 1;
  uint64   leader_id      = 2;
  uint64   prev_log_index = 3;
  uint64   prev_log_term  = 4;
  repeated LogEntry entries = 5;
  uint64   leader_commit  = 6;
}

message AppendEntriesResponse {
  uint64 term    = 1;
  bool   success = 2;

  // Not in the paper's Figure 2 — an optimization from §5.3 that lets a
  // leader skip a whole term's worth of entries per round trip instead of
  // backing up one index at a time.
  uint64 conflict_index = 3;
  uint64 conflict_term  = 4;
}

service Raft {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
}
