name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.25.1"

jobs:
  # ---------------------------------------------------------------------------
  # Static analysis, including the guards that keep simulation replay working.
  # ---------------------------------------------------------------------------
  static:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l . | grep -v '^proto/' || true)
          if [[ -n "$unformatted" ]]; then
            echo "::error::these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # The whole value of the simulation framework rests on seed-replay
      # working. These greps are what keep it working.
      - name: Determinism guards
        run: ./scripts/check-determinism.sh

      # v8 is the action major that matches the v2 config schema in
      # .golangci.yml. The version is pinned rather than "latest" because
      # golangci-lint refuses to run when the Go version it was built with is
      # older than the one this module targets, so "latest" can break the build
      # on a release that has nothing to do with this repository.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0

  # ---------------------------------------------------------------------------
  # Generated code must match the .proto files it came from.
  # ---------------------------------------------------------------------------
  proto:
    name: Protobuf up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: arduino/setup-protoc@v3
        with:
          version: "32.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Installs the versions pinned in the Makefile, not @latest. Both plugins
      # stamp their version into every generated file, so an unpinned install
      # fails this job whenever upstream tags a release.
      - name: Install pinned protoc plugins
        run: make tools

      - run: make tools-check
      - run: make proto-check

  # ---------------------------------------------------------------------------
  # Unit tests, with the race detector on.
  # ---------------------------------------------------------------------------
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - run: make test

      # A test that cannot fail on the bug it is named after is decorative.
      # This introduces each known bug and checks the guarding test notices.
      - name: Mutation check
        run: make mutation

  # ---------------------------------------------------------------------------
  # The correctness gate.
  #
  # A bounded fuzz run over the deterministic simulator. Any failing seed fails
  # the build, and the seed is printed so the failure can be replayed exactly
  # with `make replay SEED=...`. This is the step that makes the simulation
  # framework load-bearing rather than decorative.
  # ---------------------------------------------------------------------------
  simulation:
    name: Simulation fuzz gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Randomized runs of a whole cluster under message loss, reordering,
      # duplication, partitions and crashes, with Raft's safety properties
      # asserted after every event. Any failing seed fails the build, and the
      # seed alone reproduces the failure exactly:
      #
      #     make replay SEED=<the seed>
      #
      # Bounded here to keep the pull-request gate honest about its own runtime.
      - name: Fuzz the simulator
        run: make fuzz FUZZ_SEEDS=1000
