name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.25.1"

jobs:
  # ---------------------------------------------------------------------------
  # Static analysis, including the guards that keep simulation replay working.
  # ---------------------------------------------------------------------------
  static:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l . | grep -v '^proto/' || true)
          if [[ -n "$unformatted" ]]; then
            echo "::error::these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # The whole value of the simulation framework rests on seed-replay
      # working. These greps are what keep it working.
      - name: Determinism guards
        run: ./scripts/check-determinism.sh

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  # ---------------------------------------------------------------------------
  # Generated code must match the .proto files it came from.
  # ---------------------------------------------------------------------------
  proto:
    name: Protobuf up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: arduino/setup-protoc@v3
        with:
          version: "32.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - run: make proto-check

  # ---------------------------------------------------------------------------
  # Unit tests, with the race detector on.
  # ---------------------------------------------------------------------------
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - run: make test

  # ---------------------------------------------------------------------------
  # The correctness gate.
  #
  # A bounded fuzz run over the deterministic simulator. Any failing seed fails
  # the build, and the seed is printed so the failure can be replayed exactly
  # with `make replay SEED=...`. This is the step that makes the simulation
  # framework load-bearing rather than decorative.
  # ---------------------------------------------------------------------------
  # Enabled once the simulator lands (M4). Left here, commented, so the gate is
  # a visible part of the pipeline's design rather than an afterthought.
  #
  # simulation:
  #   name: Simulation fuzz gate
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-go@v5
  #       with:
  #         go-version: ${{ env.GO_VERSION }}
  #         cache: true
  #     - name: Fuzz the simulator
  #       run: make fuzz FUZZ_SEEDS=1000
