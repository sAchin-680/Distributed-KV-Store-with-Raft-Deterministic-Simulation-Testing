# The cluster as ArgoCD sees it: a chart at a path, on a branch, in a repository.
#
# Nothing here says "run five nodes". It says "make the cluster match
# deploy/helm/raftkv on main", and the chart says five. That indirection is the
# point of GitOps: the desired state is a commit, reviewable and revertible,
# rather than whatever the last person to run helm happened to type.
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: raftkv
  namespace: argocd
spec:
  description: The replicated key/value store

  sourceRepos:
    - https://github.com/sAchin-680/Distributed-KV-Store-with-Raft-Deterministic-Simulation-Testing.git

  destinations:
    - server: https://kubernetes.default.svc
      namespace: default

  # A project rather than the default one, so the blast radius is bounded. An
  # Application that self-heals is an agent with write access to the cluster:
  # if the repository it follows is compromised, whatever it is allowed to
  # create is what an attacker can create. Listing the kinds it may touch is
  # what keeps "someone edited a chart" from becoming "someone created a
  # ClusterRoleBinding".
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - {group: "", kind: Service}
    - {group: apps, kind: StatefulSet}
    - {group: policy, kind: PodDisruptionBudget}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: raftkv
  namespace: argocd
  finalizers:
    # Without this, deleting the Application orphans everything it created and
    # leaves a cluster nothing is managing.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: raftkv

  source:
    repoURL: https://github.com/sAchin-680/Distributed-KV-Store-with-Raft-Deterministic-Simulation-Testing.git
    targetRevision: main
    path: deploy/helm/raftkv
    helm:
      releaseName: kv
      values: |
        # Pinned, not "latest". A floating tag means the deployed version is
        # whatever was last pushed to the registry, which is unknowable from
        # the repository and unrevertible by reverting a commit — the two
        # properties this whole arrangement exists to provide.
        image:
          tag: "0.1.0"
          pullPolicy: IfNotPresent

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      # Revert drift without being asked. A change made by hand to a consensus
      # cluster is usually an incident response, and the dangerous ones are
      # silent — someone scales the StatefulSet down to "stop the noise" and
      # leaves it below quorum. This puts it back.
      selfHeal: true
      # Delete resources removed from the chart. Without it, deleting the
      # PodDisruptionBudget from the chart leaves the old one in the cluster
      # forever, and the repository stops describing what is running.
      prune: true

    retry:
      limit: 5
      backoff: {duration: 5s, factor: 2, maxDuration: 3m}

    syncOptions:
      - CreateNamespace=true
      # StatefulSet volumeClaimTemplates are immutable, so a chart change that
      # touches them fails to apply rather than silently doing nothing.
      - ApplyOutOfSyncOnly=true

  # The number of nodes is not ArgoCD's business to reconcile *in this
  # direction* only — it is, and that is deliberate. Scaling this cluster means
  # a membership change through joint consensus followed by a commit to the
  # chart, in that order. Letting an operator scale the StatefulSet by hand and
  # having it stick would leave the replica count and the Raft configuration
  # disagreeing, which is the state that loses quorum.
  ignoreDifferences: []

  revisionHistoryLimit: 10
